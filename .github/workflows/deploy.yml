name: CI - build y verificacion de la publicacion

# Antes: este workflow construia, sincronizaba a S3 e invalidaba CloudFront.
# El destino de la publicacion es ahora Vercel (proyecto `opitacode-web`), y el
# deploy a S3 con "s3 sync --delete" ya no es un destino valido: opitacode.com
# no tiene registro A y www.opitacode.com es NXDOMAIN.
#
# Que hace ahora: construye la landing y verifica la publicacion. No despliega.
# El despliegue a Vercel se hace con `npx vercel deploy --prod --yes` desde
# frontend-v2, o de forma automatica si se anade el secreto VERCEL_TOKEN.
#
# Configuracion de DNS en Cloudflare: deploy/CLOUDFLARE-VERCEL.md

on:
  push:
    branches:
      - main
      - publish/vercel
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build, verify, smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend-v2/package-lock.json'

      - name: Install dependencies
        working-directory: frontend-v2
        run: npm ci

      - name: Build
        working-directory: frontend-v2
        run: npm run build

      - name: Check the build contains the home in both languages
        run: |
          set -euo pipefail
          test -f frontend-v2/dist/es/index.html
          test -f frontend-v2/dist/en/index.html
          test -f frontend-v2/dist/legal/privacidad.html
          test -f frontend-v2/dist/sitemap.xml
          test -f frontend-v2/dist/robots.txt
          grep -q 'Runtime de memoria y governance' frontend-v2/dist/es/index.html
          grep -q '15.000' frontend-v2/dist/es/index.html
          echo "build contents OK"

      - name: Smoke test on the published site
        run: |
          set -euo pipefail
          URL="https://opitacode-web.vercel.app"
          UA='opitacode-web-smoke/1.0 (+https://github.com/Opita-Code/www.opitacode.com)'
          for path in /es/ /en/ /legal/privacidad.html /sitemap.xml /robots.txt; do
            code=$(curl --retry 2 --retry-delay 5 --connect-timeout 10 --max-time 30 \
                   -A "$UA" -s -o /tmp/smoke-body.txt -w "%{http_code}" "$URL$path" || echo 000)
            echo "$path -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::la ruta $path no responde 200 en el sitio publicado"
              exit 1
            fi
          done
          curl -s --max-time 30 "$URL/es/" | grep -q 'Runtime de memoria y governance'
          echo "published site OK"

      - name: Report DNS status (informativo)
        if: always()
        run: |
          echo "El DNS se configura a mano en Cloudflare."
          echo "Registros: www -> CNAME 90f17105bfb2b922.vercel-dns-017.com (DNS only)"
          echo "           @   -> A 76.76.21.21 (DNS only)"
          echo "Detalle en deploy/CLOUDFLARE-VERCEL.md"
